# Internal ClusterIP service (used by the Ingress and other pods)
apiVersion: v1
kind: Service
metadata:
  name: btc-forecast-api
  labels:
    app: btc-forecast-api
spec:
  type: ClusterIP
  selector:
    app: btc-forecast-api
  ports:
    - name: http
      port: 80
      targetPort: 5000
---
# External NodePort service (Port 80 -> TargetPort 5000, reachable on node port 30080)
apiVersion: v1
kind: Service
metadata:
  name: btc-forecast-api-nodeport
  labels:
    app: btc-forecast-api
spec:
  type: NodePort
  selector:
    app: btc-forecast-api
  ports:
    - name: http
      port: 80
      targetPort: 5000
      nodePort: 30080
