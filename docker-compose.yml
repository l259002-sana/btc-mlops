# Local integrated environment: Flask API + Postgres + Airflow (webserver, scheduler)
# First run:  mkdir -p shared && chmod -R 777 shared   (shared by API and Airflow)
#             docker compose up airflow-init && docker compose up -d
# UI: Airflow http://localhost:8080 (admin/admin)   API http://localhost:5000

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3-python3.10
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    _PIP_ADDITIONAL_REQUIREMENTS: "pandas==2.2.2 numpy==1.26.4 scikit-learn==1.5.1 joblib==1.4.2 yfinance==0.2.54 requests"
    PYTHONPATH: /opt/airflow
    DATA_DIR: /opt/airflow/shared/data
    MODEL_DIR: /opt/airflow/shared/models
    API_RELOAD_URL: http://api:5000/reload
    API_KEY: local-dev-key
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./shared:/opt/airflow/shared
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username admin --password admin --firstname a --lastname b --role Admin --email a@b.c"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    user: "50000:0"            # same uid as Airflow so both can write to ./shared
    environment:
      MODEL_DIR: /app/shared/models
      DATA_DIR: /app/shared/data
      API_KEY: local-dev-key
      LOG_LEVEL: INFO
      MODEL_STAGE: dev
    volumes:
      - ./shared:/app/shared
    ports:
      - "5000:5000"

volumes:
  pgdata:
