apiVersion: v1
kind: ConfigMap
metadata:
  name: btc-api-config
  labels:
    app: btc-forecast-api
data:
  MODEL_STAGE: "production"
  LOG_LEVEL: "INFO"
  PORT: "5000"
---
apiVersion: v1
kind: Secret
metadata:
  name: btc-api-secret
  labels:
    app: btc-forecast-api
type: Opaque
stringData:            # stored base64-encoded by Kubernetes; change before real use
  API_KEY: "change-me-super-secret"
  DB_PASSWORD: "change-me-too"
